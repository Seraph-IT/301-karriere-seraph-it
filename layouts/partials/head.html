<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<style>
  :root { --accent: #1a56db; --bg: #fafafa; --card: #fff; --border: #e5e7eb; --text: #111827; --muted: #6b7280; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .container { max-width: 900px; margin: 0 auto; padding: 0 1.5rem; }
  header { border-bottom: 1px solid var(--border); padding: 1rem 0; }
  header nav { display: flex; align-items: center; gap: 2rem; }
  header .brand { font-weight: 700; font-size: 1.1rem; color: var(--text); }
  main { padding: 2rem 0; }
  footer { border-top: 1px solid var(--border); padding: 1.5rem 0; color: var(--muted); font-size: 0.875rem; margin-top: 3rem; }
  .job-list { display: grid; gap: 1rem; margin-top: 1.5rem; }
  .job-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem 1.5rem; }
  .job-card h2 { font-size: 1.125rem; margin-bottom: 0.25rem; }
  .job-meta { font-size: 0.875rem; color: var(--muted); display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .badge { background: #eff6ff; color: var(--accent); border-radius: 4px; padding: 0.1rem 0.5rem; font-size: 0.8rem; }
  .job-detail h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
  .job-detail .meta { color: var(--muted); margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; }
  .job-detail section { margin-top: 1.5rem; }
  .job-detail h2 { font-size: 1.125rem; margin-bottom: 0.5rem; color: var(--accent); }
  .apply-btn { display: inline-block; background: var(--accent); color: #fff; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; margin-top: 2rem; }
  .apply-btn:hover { background: #1740a8; text-decoration: none; }
  h1.page-title { font-size: 1.75rem; margin-bottom: 0.25rem; }
  .page-subtitle { color: var(--muted); margin-bottom: 1.5rem; }
</style>
