{{ define "main" }}
  <h1 class="page-title">Offene Stellen</h1>
  <p class="page-subtitle">{{ .Site.Params.tagline }}</p>

  <div class="job-list">
    {{ range (where .Site.RegularPages "Section" "jobs") }}
      {{ if eq .Params.status "Active" }}
      <div class="job-card">
        <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
        <div class="job-meta">
          <span>{{ .Params.department }}</span>
          <span>{{ .Params.location }}</span>
          <span class="badge">{{ .Params.employment_type }}</span>
        </div>
      </div>
      {{ end }}
    {{ end }}
  </div>
{{ end }}
