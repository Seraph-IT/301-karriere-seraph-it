---
# CI
# Mindeststand CI: Secrets-Scan, Lint, vorhandene Tests. Rueckweg: diese Datei loeschen.
# Runner-Label wie in den uebrigen Seraph-Repos. Auf Gitea laufen gespiegelte Pushes nicht
# von selbst an, deshalb zusaetzlich schedule und workflow_dispatch.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '53 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: [self-hosted, gitea-runner]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.18.4
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz             https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          # SHA256 aus gitleaks_8.18.4_checksums.txt der offiziellen Release-Dateien
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan git history
        run: |
          # Ab 8.19 heisst der Befehl `git`, davor `detect`.
          if gitleaks git --help >/dev/null 2>&1; then
            gitleaks git --no-banner --redact --exit-code 1 .
          else
            gitleaks detect --source . --no-banner --redact --exit-code 1
          fi

  toml:
    name: Hugo-Konfiguration
    runs-on: [self-hosted, gitea-runner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: TOML parsen
        run: |
          python -c "import tomllib;tomllib.load(open('hugo.toml','rb'));print('hugo.toml ok')"
